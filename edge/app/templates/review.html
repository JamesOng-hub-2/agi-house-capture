<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Episode review · AGI House Capture</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 960px; padding: 2rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #8886; padding: .75rem; text-align: left; }
      .empty { border: 1px dashed #8888; border-radius: .75rem; padding: 2rem; }
    </style>
  </head>
  <body>
    <h1>Episode review</h1>
    {% if episodes %}
      <table>
        <thead>
          <tr>
            <th>Episode</th>
            <th>Task</th>
            <th>Size</th>
            <th>Decision</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody>
          {% for episode in episodes %}
            <tr>
              <td>{{ episode.id }}</td>
              <td>{{ episode.task_id }}</td>
              <td>{{ episode.size_bytes }} bytes</td>
              <td>{{ episode.decision }}</td>
              <td>{{ episode.reason }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="empty">No episodes received yet.</p>
    {% endif %}
  </body>
</html>
