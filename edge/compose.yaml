services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agi_house_capture
      POSTGRES_USER: agi_house
      POSTGRES_PASSWORD: agi_house
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agi_house -d agi_house_capture"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
